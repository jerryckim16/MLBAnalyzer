<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gnosia Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 24px 0 8px;
      font-size: 2rem;
      color: #7eb8ff;
      text-shadow: 0 0 20px rgba(126, 184, 255, 0.3);
    }

    /* Setup Screen */
    #setup {
      margin-top: 40px;
      background: #14142a;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 32px;
      width: 360px;
      text-align: center;
    }

    #setup label {
      display: block;
      margin: 16px 0 6px;
      font-size: 0.95rem;
      color: #aaa;
    }

    #setup input {
      width: 80px;
      padding: 8px 12px;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      background: #1a1a2e;
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }

    #setup button {
      margin-top: 24px;
      padding: 10px 32px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #4a6fa5;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }

    #setup button:hover { background: #5a8fd5; }

    #error {
      color: #ff6b6b;
      margin-top: 12px;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    /* Game Screen */
    #game {
      display: none;
      width: 90%;
      max-width: 900px;
      margin-top: 16px;
    }

    #status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #14142a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 12px 20px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    #status-bar .humans { color: #6ecf6e; }
    #status-bar .gnosia { color: #e06060; }
    #status-bar .round { color: #7eb8ff; }

    #game-content {
      display: flex;
      gap: 16px;
    }

    /* Player Roster */
    #roster {
      flex: 0 0 260px;
      background: #14142a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 16px;
      max-height: 500px;
      overflow-y: auto;
    }

    #roster h3 {
      margin-bottom: 12px;
      color: #7eb8ff;
      font-size: 1rem;
    }

    .player {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      margin-bottom: 4px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .player.alive { background: #1a1a2e; }
    .player.dead { background: #1a1a2e; opacity: 0.45; text-decoration: line-through; }

    .role-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .role-tag.human { background: #1a3a1a; color: #6ecf6e; }
    .role-tag.gnosia { background: #3a1a1a; color: #e06060; }
    .role-tag.hidden { background: #2a2a3a; color: #888; }

    /* Log */
    #log-panel {
      flex: 1;
      background: #14142a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 16px;
      max-height: 500px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    #log-panel h3 {
      margin-bottom: 12px;
      color: #7eb8ff;
      font-size: 1rem;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .log-entry { margin-bottom: 4px; }
    .log-night { color: #a080d0; }
    .log-day { color: #d0b060; }
    .log-result { color: #7eb8ff; font-weight: bold; }
    .log-win { color: #6ecf6e; font-weight: bold; font-size: 1.1rem; }
    .log-lose { color: #e06060; font-weight: bold; font-size: 1.1rem; }
    .log-divider { border-top: 1px solid #2a2a4a; margin: 8px 0; }

    /* Controls */
    #controls {
      margin-top: 16px;
      text-align: center;
    }

    #controls button {
      padding: 10px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin: 0 6px;
    }

    #next-btn { background: #4a6fa5; color: #fff; }
    #next-btn:hover { background: #5a8fd5; }
    #auto-btn { background: #3a5a3a; color: #fff; }
    #auto-btn:hover { background: #4a7a4a; }
    #restart-btn { background: #5a3a3a; color: #fff; }
    #restart-btn:hover { background: #7a4a4a; }
  </style>
</head>
<body>

<h1>Gnosia Simulator</h1>

<div id="setup">
  <p style="color:#aaa; margin-bottom:8px;">Configure your simulation</p>
  <label for="total-players">Total Players</label>
  <input type="number" id="total-players" value="15" min="3" max="50">
  <label for="gnosia-count">Number of Gnosia</label>
  <input type="number" id="gnosia-count" value="3" min="1" max="49">
  <br>
  <button onclick="startGame()">Start Simulation</button>
  <div id="error"></div>
</div>

<div id="game">
  <div id="status-bar">
    <span class="round" id="round-display">Round 1</span>
    <span class="humans" id="human-count"></span>
    <span class="gnosia" id="gnosia-count-display"></span>
  </div>
  <div id="game-content">
    <div id="roster">
      <h3>Crew</h3>
      <div id="player-list"></div>
    </div>
    <div id="log-panel">
      <h3>Event Log</h3>
      <div id="log"></div>
    </div>
  </div>
  <div id="controls">
    <button id="next-btn" onclick="nextPhase()">Next Phase</button>
    <button id="auto-btn" onclick="toggleAuto()">Auto Play</button>
    <button id="restart-btn" onclick="restart()">Restart</button>
  </div>
</div>

<script>
const NAMES = [
  "Setsu", "Gina", "SQ", "Raqio", "Stella",
  "Shigemichi", "Yuriko", "Remnan", "Comet", "Otome",
  "Sha-Ming", "Jonas", "Kukrushka", "Joyce", "Chipie",
  "Ran", "Nova", "Enju", "Mika", "Haru",
  "Sayo", "Fei", "Lux", "Dion", "Kei",
  "Zara", "Nix", "Orin", "Vela", "Cass",
  "Rhea", "Sora", "Io", "Lyra", "Pax",
  "Echo", "Wren", "Juno", "Ash", "Sol",
  "Mira", "Thea", "Kai", "Rune", "Sage",
  "Onyx", "Vale", "Iris", "Lark", "Dusk"
];

let players = [];
let round = 0;
let phase = "night"; // "night" or "day"
let gameOver = false;
let autoInterval = null;

function startGame() {
  const totalInput = document.getElementById("total-players");
  const gnosiaInput = document.getElementById("gnosia-count");
  const errorEl = document.getElementById("error");

  const total = parseInt(totalInput.value);
  const gnosiaNum = parseInt(gnosiaInput.value);

  if (isNaN(total) || isNaN(gnosiaNum)) {
    errorEl.textContent = "Please enter valid numbers.";
    return;
  }
  if (total < 3) {
    errorEl.textContent = "Need at least 3 players.";
    return;
  }
  if (total > 50) {
    errorEl.textContent = "Maximum 50 players.";
    return;
  }
  if (gnosiaNum < 1) {
    errorEl.textContent = "Need at least 1 Gnosia.";
    return;
  }
  if (gnosiaNum >= total) {
    errorEl.textContent = "Gnosia count must be less than total players.";
    return;
  }

  errorEl.textContent = "";

  // Generate players
  const shuffledNames = [...NAMES].sort(() => Math.random() - 0.5).slice(0, total);
  players = shuffledNames.map((name, i) => ({
    name,
    role: i < gnosiaNum ? "gnosia" : "human",
    alive: true
  }));
  // Shuffle so gnosia aren't always first
  players.sort(() => Math.random() - 0.5);

  round = 1;
  phase = "night";
  gameOver = false;
  autoInterval = null;

  document.getElementById("setup").style.display = "none";
  document.getElementById("game").style.display = "block";
  document.getElementById("log").innerHTML = "";

  addLog("log-result", `Game started: ${total} players, ${gnosiaNum} Gnosia`);
  addLog("log-result", `Gnosia: ${players.filter(p => p.role === "gnosia").map(p => p.name).join(", ")}`);
  addDivider();

  updateUI();
}

function getAlive(role) {
  return players.filter(p => p.alive && (role ? p.role === role : true));
}

function addLog(cls, text) {
  const el = document.createElement("div");
  el.className = "log-entry " + cls;
  el.textContent = text;
  document.getElementById("log").appendChild(el);
  document.getElementById("log").scrollTop = document.getElementById("log").scrollHeight;
}

function addDivider() {
  const el = document.createElement("div");
  el.className = "log-divider";
  document.getElementById("log").appendChild(el);
}

function checkWin() {
  const humans = getAlive("human").length;
  const gnosia = getAlive("gnosia").length;

  if (gnosia === 0) {
    addLog("log-win", "Humans win! All Gnosia have been eliminated.");
    gameOver = true;
    return true;
  }
  if (humans <= gnosia) {
    addLog("log-lose", `Gnosia win! Humans (${humans}) ≤ Gnosia (${gnosia}).`);
    gameOver = true;
    return true;
  }
  return false;
}

function nightPhase() {
  addLog("log-night", `── Night ${round} ──`);

  const humans = getAlive("human");
  if (humans.length === 0) {
    checkWin();
    return;
  }

  const victim = humans[Math.floor(Math.random() * humans.length)];
  victim.alive = false;

  addLog("log-night", `The Gnosia attacked ${victim.name}. ${victim.name} has been eliminated.`);

  if (checkWin()) return;

  phase = "day";
}

function dayPhase() {
  addLog("log-day", `── Day ${round} ──`);

  const alive = getAlive();
  if (alive.length === 0) return;

  // Each player votes for someone else randomly
  const votes = {};
  alive.forEach(p => { votes[p.name] = 0; });

  alive.forEach(voter => {
    const candidates = alive.filter(c => c.name !== voter.name);
    if (candidates.length === 0) return;
    const target = candidates[Math.floor(Math.random() * candidates.length)];
    votes[target.name]++;
  });

  // Find max votes
  const maxVotes = Math.max(...Object.values(votes));
  const topCandidates = alive.filter(p => votes[p.name] === maxVotes);
  const eliminated = topCandidates[Math.floor(Math.random() * topCandidates.length)];

  // Log vote summary
  const voteSummary = alive
    .map(p => `${p.name}: ${votes[p.name]}`)
    .sort((a, b) => parseInt(b.split(": ")[1]) - parseInt(a.split(": ")[1]))
    .join(", ");
  addLog("log-day", `Votes: ${voteSummary}`);

  eliminated.alive = false;
  const roleText = eliminated.role === "gnosia" ? "Gnosia" : "Human";
  addLog("log-day", `${eliminated.name} was voted out. They were ${roleText}.`);

  if (checkWin()) return;

  addDivider();
  round++;
  phase = "night";
}

function nextPhase() {
  if (gameOver) return;

  if (phase === "night") {
    nightPhase();
  } else {
    dayPhase();
  }

  updateUI();
}

function toggleAuto() {
  const btn = document.getElementById("auto-btn");
  if (autoInterval) {
    clearInterval(autoInterval);
    autoInterval = null;
    btn.textContent = "Auto Play";
    btn.style.background = "#3a5a3a";
  } else {
    btn.textContent = "Stop Auto";
    btn.style.background = "#7a4a4a";
    autoInterval = setInterval(() => {
      if (gameOver) {
        clearInterval(autoInterval);
        autoInterval = null;
        btn.textContent = "Auto Play";
        btn.style.background = "#3a5a3a";
        return;
      }
      nextPhase();
    }, 800);
  }
}

function restart() {
  if (autoInterval) {
    clearInterval(autoInterval);
    autoInterval = null;
  }
  document.getElementById("game").style.display = "none";
  document.getElementById("setup").style.display = "block";
  document.getElementById("auto-btn").textContent = "Auto Play";
  document.getElementById("auto-btn").style.background = "#3a5a3a";
}

function updateUI() {
  const humans = getAlive("human").length;
  const gnosia = getAlive("gnosia").length;

  document.getElementById("round-display").textContent = `Round ${round} — ${phase === "night" ? "Night" : "Day"}`;
  document.getElementById("human-count").textContent = `Humans: ${humans}`;
  document.getElementById("gnosia-count-display").textContent = `Gnosia: ${gnosia}`;

  // Render roster
  const list = document.getElementById("player-list");
  list.innerHTML = "";
  players.forEach(p => {
    const div = document.createElement("div");
    div.className = "player " + (p.alive ? "alive" : "dead");

    const nameSpan = document.createElement("span");
    nameSpan.textContent = p.name;

    const roleSpan = document.createElement("span");
    roleSpan.className = "role-tag ";
    if (!p.alive) {
      roleSpan.className += p.role;
      roleSpan.textContent = p.role === "gnosia" ? "Gnosia" : "Human";
    } else {
      roleSpan.className += "hidden";
      roleSpan.textContent = "???";
    }

    div.appendChild(nameSpan);
    div.appendChild(roleSpan);
    list.appendChild(div);
  });

  // Disable next button if game over
  document.getElementById("next-btn").disabled = gameOver;
}
</script>

</body>
</html>
